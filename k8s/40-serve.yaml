apiVersion: apps/v1
kind: Deployment
metadata: {name: agnews-api, namespace: mlops}
spec:
  replicas: 1
  selector: {matchLabels: {app: agnews-api}}
  template:
    metadata: {labels: {app: agnews-api}}
    spec:
      containers:
        - name: api
          image: agnews-api:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          env:
            - {name: MLFLOW_TRACKING_URI, value: "http://mlflow.mlops.svc.cluster.local:5000"}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata: {name: agnews-api, namespace: mlops}
spec:
  selector: {app: agnews-api}
  ports: [{port: 8000, targetPort: 8000}]